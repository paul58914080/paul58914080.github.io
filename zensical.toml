[project]
site_name = "Paul WILLIAMS"
site_description = "Personal, searchable notes on software development, tools, and productivity — concise guides, tips, and references."
site_author = "Paul WILLIAMS"
site_url = "https://paulwilliams.dev/"
copyright = """
Copyright &copy; 2026 Paul WILLIAMS. All rights reserved.
"""

nav = [
    { "Home" = "index.md" },
    { "Craft" = [
        { "API Design" = "pages/craft/api-first/index.md" },
        { "Hexagonal architecture" = "pages/craft/hexagonal-architecture/index.md" }
    ] },
    { "Data" = [
        { "Introduction" = "pages/data/introduction/index.md" },
        { "Generation" = "pages/data/generation/index.md" }
    ] },
    { "AI" = [
        { "Github Copilot" = "pages/ai/github-copilot/index.md" }
    ] },
    { "Frontend" = [
        { "Scaffold angular" = "pages/frontend/scaffold-angular/index.md" },
        { "Testing angular" = "pages/frontend/testing-angular/index.md" },
        { "RxJS" = "pages/frontend/rxjs/index.md" },
        { "Micro frontend" = "pages/frontend/micro-frontend/index.md" }
    ] },
    { "Backend" = [
        { "Scaffold hexagon spring-boot" = "pages/backend/scaffold-hexagon-spring-boot/index.md" }
    ] },
    { "DevOps" = [
        { "Docker" = "pages/devops/docker/index.md" },
        { "Distroless images" = "pages/devops/distroless-images/index.md" },
        { "Github actions" = "pages/devops/github-actions/index.md" },
        { "Maven central publish" = "pages/devops/maven-central-publish/index.md" }
    ] },
    { "Mac" = [
        { "Homebrew" = "pages/mac/homebrew/index.md" }
    ] },
    { "Tools" = [
        { "Git" = "pages/tools/git/index.md" },
        { "SDKMAN" = "pages/tools/sdkman/index.md" },
        { "JDK" = "pages/tools/jdk/index.md" },
        { "Maven" = "pages/tools/maven/index.md" },
        { "Gradle" = "pages/tools/gradle/index.md" },
        { "Node" = "pages/tools/node/index.md" },
        { "Yarn" = "pages/tools/yarn/index.md" }
    ] },
    { "Tips & Tricks" = [
        { "Beautify terminals" = "pages/tips-and-tricks/beautify-terminal/index.md" },
        { "IntelliJ" = "pages/tips-and-tricks/intellij/index.md" }
    ] }
]

extra_css = ["stylesheets/bootstrap-grid.min.css", "stylesheets/skills.css", "stylesheets/custom.css", "stylesheets/typography.css"]

[project.theme]
custom_dir = "docs/overrides"

#favicon = "images/favicon.png"
language = "en"

features = [
    "announce.dismiss",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.prune",
    "navigation.sections",
    "navigation.tabs",
    "navigation.tabs.sticky",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "toc.follow"
]

[[project.theme.palette]]
scheme = "slate"


